apis:
- aid: natera:natera-epic-aura-hub
  name: Natera Epic Aura Hub Integration
  tags:
  - Epic
  - Aura
  - Bidirectional
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.natera.com/emr/
  baseURL: ''
  properties:
  - url: https://www.natera.com/emr/
    type: Documentation
  description: >-
    Connect once to the Epic Aura (Order and Results Anywhere) hub for secure, HIPAA-compliant bidirectional
    order and results integration, transmitting order documentation (progress notes, pathology reports,
    pedigree charts, cancer history) into Natera and results back into the patient EHR.
- aid: natera:natera-oncoemr-integration
  name: Natera OncoEMR (Flatiron) Integration
  tags:
  - Oncology
  - OncoEMR
  - Flatiron
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.natera.com/oncology/
  baseURL: ''
  properties:
  - url: https://www.natera.com/oncology/
    type: Documentation
  description: >-
    Natera's oncology testing portfolio integrated into Flatiron Health's cloud-based OncoEMR platform
    for electronic ordering and results delivery inside the cancer-care clinical workflow.
- aid: natera:natera-constellation-platform
  name: Natera Constellation Bioinformatics Platform
  tags:
  - Bioinformatics
  - cfDNA
  - Partner Labs
  - NIPT
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://constellation.natera.com
  baseURL: ''
  properties:
  - url: https://constellation.natera.com
    type: Documentation
  description: >-
    Cloud-based platform giving partner laboratories programmatic access to Natera's cell-free DNA bioinformatic
    algorithms (e.g., Panorama NIPT) to run, monitor, and troubleshoot genetic analysis jobs. B2B partner
    access, not a public developer API.
- aid: natera:natera-connect-clinician-portal
  name: Natera Connect Clinician Portal
  tags:
  - Portal
  - Clinician
  - Ordering
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://connect.natera.com/users/log_in
  baseURL: ''
  properties:
  - url: https://www.natera.com/natera-portal-hub/
    type: Documentation
  description: >-
    Web portal (Women's Health, Oncology, Organ Health, Rare Disease) for clinicians to order kits and
    supplies, check testing status and results, download and share reports, and schedule genetic counselor
    conversations.
- aid: natera:natera-provider-mobile-app
  name: Natera Provider Mobile App
  tags:
  - Mobile
  - Provider
  - iOS
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://apps.apple.com/us/app/natera-provider/id1559183134
  baseURL: ''
  properties:
  - url: https://apps.apple.com/us/app/natera-provider/id1559183134
    type: Documentation
  description: >-
    Provider-facing mobile application backed by Natera's private internal services for managing orders
    and results on the go. No public API surface is documented for the backend.
