meters:
- name: tests_billed
  description: Genetic tests ordered and billed to patient/payer (not an API meter).
  unit: tests
  aggregation: sum
  dimensions:
  - account
  - test
- name: ehr_integration
  description: EHR integration agreement (Epic Aura / HL7 / OncoEMR), billed by contract.
  unit: contracts
  aggregation: count
  dimensions:
  - health_system
- name: constellation_jobs
  description: Genetic analysis jobs run by partner labs on Constellation, governed by partnership terms.
  unit: jobs
  aggregation: sum
  dimensions:
  - partner
principles:
- name: Visibility
  description: Track genetic test order volume and EHR/partner integration agreements; no public API usage export exists.
- name: Allocation
  description: Map test billing to patients/payers and integration costs to the contracting health system or partner lab.
- name: Optimization
  description: Use EHR integration (Aura/OncoEMR) to reduce manual ordering overhead; leverage Natera patient-assistance programs where applicable.
- name: Accountability
  description: Assign owners for clinical billing reconciliation and for each integration/partnership agreement.
