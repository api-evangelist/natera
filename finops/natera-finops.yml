description: >-
  FinOps view of Natera. Natera does not bill usage-based API consumption.
  Costs are clinical (genetic tests billed to patients/payers per test, often
  through insurance with patient-assistance programs) and commercial (EHR
  integration and Constellation partner-lab agreements). There is no public,
  metered API spend model to map to FOCUS, so this artifact is unreconciled
  and provided for cataloging consistency only.
notes: >-
  reconciled false: no usage-based API billing or public rate card exists.
  Spend is test-level (insurance/self-pay) and contract-level (integration /
  partnership). Revisit if Natera publishes a developer or partner billing
  model.
